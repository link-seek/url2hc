name: Build to SWR

on:
  workflow_dispatch:
    inputs:
      dockerfile_inline:
        description: 'Dockerfile content (inline, alternative to url)'
        required: false
        default: ''
      dockerfile_url:
        description: 'Dockerfile URL (used when inline is empty)'
        required: false
        default: ''
      target_name:
        description: 'Target image name in SWR (required)'
        required: true
      target_tag:
        description: 'Target tag'
        required: false
        default: 'latest'
      build_args:
        description: 'Build args, one KEY=VAL per line (optional)'
        required: false
        default: ''
      swr_registry:
        description: 'SWR registry endpoint override (default: swr.<region>.myhuaweicloud.com)'
        required: false
        default: ''
      swr_namespace:
        description: 'SWR namespace (org)'
        required: false
        default: 'link-seek'
      swr_region:
        description: 'SWR region for public/retention settings'
        required: false
        default: 'cn-north-4'
      is_public:
        description: 'Make repo public'
        required: false
        default: true
        type: boolean
      expire_days:
        description: 'Retention days (<=0 skips retention rule)'
        required: false
        default: '7'
      tag_pattern:
        description: 'Retention tag selector regexp'
        required: false
        default: '.*'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Login to SWR
        env:
          HUAWEI_AK: ${{ secrets.PROD_HCLOUD_AK }}
          HUAWEI_SK: ${{ secrets.PROD_HCLOUD_SK }}
        run: |
          set -e
          REGISTRY="${{ inputs.swr_registry }}"
          [ -z "$REGISTRY" ] && REGISTRY="swr.${{ inputs.swr_region }}.myhuaweicloud.com"
          [ -n "$HUAWEI_AK" ] && [ -n "$HUAWEI_SK" ] || { echo "FAIL: missing PROD_HCLOUD_AK/SK"; exit 1; }
          LOGIN_KEY=$(printf '%s' "$HUAWEI_AK" | openssl dgst -binary -sha256 -hmac "$HUAWEI_SK" | od -An -vtx1 | tr -d ' \n')
          [ -n "$LOGIN_KEY" ] || { echo "FAIL: derive login key"; exit 1; }
          echo "::add-mask::$LOGIN_KEY"
          echo "$LOGIN_KEY" | docker login -u "${{ inputs.swr_region }}@${HUAWEI_AK}" --password-stdin "$REGISTRY" 2>&1 | tail -1
          echo "REGISTRY=$REGISTRY" >> $GITHUB_ENV

      - name: Prepare Dockerfile
        env:
          DOCKERFILE_INLINE: ${{ inputs.dockerfile_inline }}
          DOCKERFILE_URL: ${{ inputs.dockerfile_url }}
        run: |
          set -e
          mkdir -p /tmp/buildctx
          if [ -n "$DOCKERFILE_INLINE" ]; then
            printf '%s' "$DOCKERFILE_INLINE" > /tmp/buildctx/Dockerfile
          elif [ -n "$DOCKERFILE_URL" ]; then
            curl -fsSL "$DOCKERFILE_URL" -o /tmp/buildctx/Dockerfile
          else
            echo "ERROR: one of dockerfile_inline / dockerfile_url is required"
            exit 1
          fi
          echo "----- Dockerfile -----"
          cat /tmp/buildctx/Dockerfile
          echo "----------------------"

      - name: Build and push
        env:
          BUILD_ARGS_INPUT: ${{ inputs.build_args }}
        run: |
          set -e
          TARGET="${{ env.REGISTRY }}/${{ inputs.swr_namespace }}/${{ inputs.target_name }}:${{ inputs.target_tag }}"
          BUILD_ARGS=""
          if [ -n "$BUILD_ARGS_INPUT" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              BUILD_ARGS="$BUILD_ARGS --build-arg $line"
            done <<< "$BUILD_ARGS_INPUT"
          fi
          # shellcheck disable=SC2086
          docker build -f /tmp/buildctx/Dockerfile $BUILD_ARGS -t "$TARGET" /tmp/buildctx
          docker push "$TARGET"
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "TARGET_NAME=${{ inputs.target_name }}" >> $GITHUB_ENV
          echo "Pushed: $TARGET"

      - name: Set image visibility & retention
        run: |
          pip install huaweicloudsdkcore huaweicloudsdkswr
          if [ "${{ inputs.is_public }}" = "true" ]; then PUBLIC_FLAG="--public"; else PUBLIC_FLAG="--no-public"; fi
          python scripts/set_swr_public.py \
            --namespace "${{ inputs.swr_namespace }}" \
            --repo "$TARGET_NAME" \
            --region "${{ inputs.swr_region }}" \
            --expire-days "${{ inputs.expire_days }}" \
            --tag-pattern "${{ inputs.tag_pattern }}" \
            $PUBLIC_FLAG \
            --ak "${{ secrets.PROD_HCLOUD_AK }}" \
            --sk "${{ secrets.PROD_HCLOUD_SK }}"
