name: Download to OBS

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to download'
        required: true
      obs_key:
        description: 'Path under <prefix> (default: <filename>)'
        required: false
        default: ''
      bucket:
        description: 'OBS bucket name'
        required: false
        default: 'xieyucheng'
      region:
        description: 'OBS region'
        required: false
        default: 'cn-north-9'
      prefix:
        description: 'OBS key prefix (empty = bucket root)'
        required: false
        default: '下载/'
      expire_days:
        description: 'Auto-delete + signed-URL days (<=0 keeps permanently)'
        required: false
        default: '7'
      endpoint:
        description: 'OBS endpoint override (default: obs.<region>.myhuaweicloud.com)'
        required: false
        default: ''
      header:
        description: 'Extra header (e.g. "Authorization: Bearer xxx"), optional'
        required: false
        default: ''

env:
  OBS_AK: ${{ secrets.OBS_AK }}
  OBS_SK: ${{ secrets.OBS_SK }}

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install esdk-obs-python

      - name: Download and upload
        run: |
          CMD="python scripts/upload_to_obs.py --url '${{ inputs.url }}' --bucket '${{ inputs.bucket }}' --region '${{ inputs.region }}' --prefix '${{ inputs.prefix }}' --expire-days '${{ inputs.expire_days }}'"
          if [ -n "${{ inputs.obs_key }}" ]; then
            CMD="$CMD --obs-key '${{ inputs.obs_key }}'"
          fi
          if [ -n "${{ inputs.endpoint }}" ]; then
            CMD="$CMD --endpoint '${{ inputs.endpoint }}'"
          fi
          if [ -n "${{ inputs.header }}" ]; then
            CMD="$CMD --header '${{ inputs.header }}'"
          fi
          echo "Running: $CMD"
          eval $CMD
          echo ""
          echo "================ ${{ inputs.expire_days }}-day download link ================"
          cat /tmp/download_link.txt
          echo ""
          echo "================ BASE64 (safe copy) ================"
          base64 -w0 /tmp/download_link.txt
          echo ""
          echo "======================================================"

      - name: Upload download link artifact
        uses: actions/upload-artifact@v4
        with:
          name: download-link
          path: /tmp/download_link.txt
          retention-days: 7
