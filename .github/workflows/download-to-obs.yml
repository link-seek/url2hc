name: Download to OBS

on:
  workflow_dispatch:
    inputs:
      url:
        description: 'URL to download'
        required: true
      obs_key:
        description: 'Path under 下载/ (default: <filename>)'
        required: false
        default: ''
      bucket:
        description: 'OBS bucket name'
        required: false
        default: 'xieyucheng'
      region:
        description: 'OBS region'
        required: false
        default: 'cn-north-9'
      header:
        description: 'Extra header (e.g. "Authorization: Bearer xxx"), optional'
        required: false
        default: ''

env:
  OBS_AK: ${{ secrets.OBS_AK }}
  OBS_SK: ${{ secrets.OBS_SK }}

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install OBS SDK
        run: pip install esdk-obs-python

      - name: Install hcloud CLI
        run: |
          curl -sL "https://ap-southeast-3-hwcloudcli.obs.ap-southeast-3.myhuaweicloud.com/cli/latest/huaweicloud-cli-linux-amd64.tar.gz" -o /tmp/hcloud.tar.gz
          mkdir -p /tmp/hcloud-cli
          tar xzf /tmp/hcloud.tar.gz -C /tmp/hcloud-cli
          echo "/tmp/hcloud-cli" >> $GITHUB_PATH

      - name: Configure hcloud
        run: |
          echo "y" | hcloud --help > /dev/null 2>&1
          hcloud config set --cli-region=${{ inputs.region }}
          hcloud config set --ak=${{ secrets.OBS_AK }}
          hcloud config set --sk=${{ secrets.OBS_SK }}

      - name: Download and upload
        run: |
          CMD="python scripts/upload_to_obs.py --url '${{ inputs.url }}' --bucket '${{ inputs.bucket }}' --region '${{ inputs.region }}'"
          if [ -n "${{ inputs.obs_key }}" ]; then
            CMD="$CMD --obs-key '${{ inputs.obs_key }}'"
          fi
          if [ -n "${{ inputs.header }}" ]; then
            CMD="$CMD --header '${{ inputs.header }}'"
          fi
          echo "Running: $CMD"
          eval $CMD
