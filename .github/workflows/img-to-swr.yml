name: Image to SWR

on:
  workflow_dispatch:
    inputs:
      source_image:
        description: 'Source image (e.g. ghcr.io/anomalyco/opencode:latest)'
        required: true
        default: 'ghcr.io/anomalyco/opencode:latest'
      target_name:
        description: 'Target image name in SWR'
        required: false
        default: ''
      target_tag:
        description: 'Target tag'
        required: false
        default: ''
      swr_region:
        description: 'SWR region (registry/namespace/login all follow this; e.g. cn-north-9 or cn-north-4)'
        required: false
        default: 'cn-north-9'

env:
  SWR_NAMESPACE: link-seek

jobs:
  pull-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u $ --password-stdin

      - name: Login to SWR
        # 组织 _9 私有（url2hc 仓不可见）→ 回落仓级同名 secret；公开后删回落。
        run: |
          U="${{ secrets.SWR_LOGIN_USER_9 }}"; P="${{ secrets.SWR_LOGIN_PASS_9 }}"
          [ -z "$U" ] && U="${{ secrets.SWR_LOGIN_USER }}"; [ -z "$P" ] && P="${{ secrets.SWR_LOGIN_PASS }}"
          [ -n "$U" ] && [ -n "$P" ] || { echo "FAIL: no SWR creds for region ${{ inputs.swr_region }}"; exit 1; }
          echo "$P" | docker login swr.${{ inputs.swr_region }}.myhuaweicloud.com -u "$U" --password-stdin

      - name: Pull source image
        run: docker pull ${{ inputs.source_image }}

      - name: Retag and push
        run: |
          SOURCE="${{ inputs.source_image }}"
          REPO=$(echo "$SOURCE" | sed 's/:.*//')
          TAG=$(echo "$SOURCE" | sed 's/.*://' | sed 's/^$/latest/')
          BASENAME=$(basename "$REPO")

          TARGET_NAME="${{ inputs.target_name }}"
          TARGET_TAG="${{ inputs.target_tag }}"
          [ -z "$TARGET_NAME" ] && TARGET_NAME="$BASENAME"
          [ -z "$TARGET_TAG" ] && TARGET_TAG="$TAG"

          TARGET="swr.${{ inputs.swr_region }}.myhuaweicloud.com/${{ env.SWR_NAMESPACE }}/${TARGET_NAME}:${TARGET_TAG}"
          docker tag "$SOURCE" "$TARGET"
          docker push "$TARGET"
          echo "TARGET_NAME=$TARGET_NAME" >> $GITHUB_ENV
          echo "TARGET=$TARGET" >> $GITHUB_ENV
          echo "Pushed: $TARGET"

      - name: Set image public & 7-day retention
        run: |
          pip install huaweicloudsdkcore huaweicloudsdkswr
          python scripts/set_swr_public.py \
            --namespace "${{ env.SWR_NAMESPACE }}" \
            --repo "$TARGET_NAME" \
            --region "${{ inputs.swr_region }}" \
            --ak "${{ secrets.HCLOUD_AK }}" \
            --sk "${{ secrets.HCLOUD_SK }}"
